name: Docs

# Paths are evaluated by GitHub before a Vercel deployment is requested.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "vercel.json"
      - "scripts/prepare-prebuilt.mjs"
      - "scripts/deployment.test.mjs"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "astro.config.mjs"
      - "tsconfig.json"
      - "vercel.json"
      - "scripts/prepare-prebuilt.mjs"
      - "scripts/deployment.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test deployment contract and output
        working-directory: .
        run: node --test scripts/deployment.test.mjs scripts/prepare-prebuilt.test.mjs
      - name: Check documentation
        run: bun run check
      - name: Build static site in CI
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          bun run build
          node scripts/prepare-prebuilt.mjs
      - name: Deploy production site
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        # Run the Vercel CLI from repo root (its configured root may be a subfolder).
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@latest deploy --prebuilt --prod --yes --non-interactive
